# nginx_informs.conf
# Specialized nginx configuration for InForms application with WebSocket support
# This config is used by setup_webhost.sh when processing the 'informs' app

# HTTP Server Block
server {
    listen 80;
    server_name @{FQDN};

    # support certbot folder
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl;
    http2 on;
    server_name @{FQDN};

    ssl_certificate /etc/letsencrypt/live/@{FQDN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@{FQDN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /root/resources/nginx_logging.conf;

    # set a decent default root directory
    root /usr/share/nginx/html/;

    # =========================================================================
    # WebSocket Proxy for TAKMesh Gateway
    # IMPORTANT: Using ^~ prefix to stop location search and ensure this takes
    # precedence over catch-all location / and security regex rules
    # =========================================================================
    # Proxies WebSocket connections to the takmesh gateway container.
    # Browser connects via wss://domain/ws/messages -> takmesh:8090/ws/messages
    #
    # WebSocket Compression Note:
    # - Nginx does NOT compress WebSocket frames (it's a pass-through proxy)
    # - Compression happens at protocol level (permessage-deflate) between
    #   browser and FastAPI server, negotiated during WebSocket handshake
    # - This is very effective for JSON/ASCII payloads (70-90% reduction)
    # =========================================================================
    location ^~ /ws/ {
        # Proxy to takmesh gateway container
        proxy_pass http://takmesh:8090/ws/;

        # WebSocket requires HTTP/1.1 with upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # =========================================================================
        # Source IP Preservation (Critical for Django/Python logging)
        # These headers ensure the upstream application receives the real client IP
        # =========================================================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;

        # Forward WebSocket protocol headers if present
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        # =========================================================================
        # Connection Robustness
        # =========================================================================
        # Timeout for establishing connection to upstream
        proxy_connect_timeout 10s;
        
        # Extended timeouts for long-lived WebSocket connections
        # WebSocket connections can stay open for hours
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Optimize TCP settings for low latency
        tcp_nodelay on;

        # =========================================================================
        # Efficiency Improvements
        # =========================================================================
        # Optimize buffer sizes for WebSocket frames (smaller buffers for real-time traffic)
        proxy_buffer_size 4k;

        # Disable buffering for real-time WebSocket traffic
        proxy_buffering off;

        # Don't cache WebSocket connections
        proxy_cache off;

        # =========================================================================
        # Logging Configuration
        # Logs appear in both dedicated files AND Docker container logs (stdout/stderr)
        # =========================================================================
        # Access logs: both file and stdout for Docker visibility
        access_log /var/log/nginx/websocket.log websocket_ext;
        access_log /dev/stdout websocket_ext;
        
        # Error logs: both file and stderr for Docker visibility
        error_log /var/log/nginx/websocket_errors.log warn;
        error_log /dev/stderr warn;

        # Security headers for WebSocket endpoint
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Include security config AFTER WebSocket location to ensure /ws/ takes precedence
    include /root/resources/nginx_security.conf;

    location /himom {
        return 200 "Hi Mom!";
        add_header Content-Type text/plain;
    }

    # don't log favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Static Files
    # =========================================================================
    location /static/ {
        alias /var/www/@{APPNAME}/static/;

        # Compression for static files
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;

        # Cache static files
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # Django Application Proxy
    # =========================================================================
    location / {
        proxy_set_header Host $host;
        proxy_pass http://@{UPSTREAM_HOST}:@{PORT};
        proxy_read_timeout 60;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Xss-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permission-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $hsts_header always;

        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Compression for HTTP responses (not WebSocket)
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
        gzip_proxied any;
    }
}
