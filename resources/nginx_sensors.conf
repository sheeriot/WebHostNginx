server {

    listen 80;
    server_name @{FQDN};
    
    include /root/resources/nginx_security.conf;
    # set a decent default root directory
    root /usr/share/nginx/html/;

    # Manual Redirect Logic:
    set $do_redirect 1;

    if ($request_uri ~ "^/.well-known/acme-challenge/") {
        set $do_redirect 0;
    }
    if ($request_uri ~ "^/webhook/") {
        set $do_redirect 0;
    }
    if ($scheme = "https") {
        set $do_redirect 0;
    }

    if ($do_redirect = 1) {
        return 301 https://$host$request_uri;
    }

    location /himom { 
        return 200 "Hi Mom! This is the Sensors service.";
        add_header Content-Type text/plain;
    }
    
    # don't log favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # support certbot folder
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_set_header Host $host;
        proxy_pass http://@{APPNAME}:@{PORT};
        proxy_read_timeout 60;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Xss-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permission-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $hsts_header always;

        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Compression
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
        gzip_proxied any;
    }

    # Explicitly allow webhook on HTTP
    location /webhook/ {
        proxy_set_header Host $host;
        proxy_pass http://@{APPNAME}:@{PORT};
        proxy_read_timeout 60;

        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # We generally don't enforce HSTS on the plain HTTP webhook endpoint itself
        # because the sender might not support it, but if they do HTTPS, they get these:
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Xss-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # WebSocket support
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_pass http://@{APPNAME}:@{PORT};
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /var/www/@{APPNAME}/static/;
        try_files $uri $uri/ =404;
        
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
    }
}
