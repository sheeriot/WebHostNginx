map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

log_format main_ext '$remote_addr - $remote_user [$time_local] "$host" '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

# Map for HSTS header - only send on HTTPS
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Hide Nginx version
server_tokens off;

# Optimize for high traffic (optional but good practice)
# client_max_body_size is set per location if needed, default is 1M
