# Log security violations to a separate file so they can be reviewed.
# The 'notice' level is used because 'deny' rules are logged at this level.
# We explicitly do NOT log these to stderr to keep docker logs clean.
error_log /var/log/nginx/security_violations.log notice;

# Note: WebSocket paths (/ws/) are protected from these security rules because
# they use the '^~' prefix modifier in nginx_informs.conf, which stops location
# search and prevents regex location blocks from being evaluated.

# Block probes for common vulnerabilities.
# Since this server hosts Django applications, any requests for PHP files
# are illegitimate and likely part of a vulnerability scan.

# Block requests for PHP files
location ~ \.php$ {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block requests for common WordPress paths
location ~* /(wp-admin|wp-login|wp-includes|xmlrpc\.php) {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block requests for other common scan targets and sensitive files
location ~* /(credentials|geoserver) {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block requests for System path (common probe target)
location ~* ^/System {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block access to hidden files and directories (e.g., .git, .env)
location ~ /\. {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block requests for various .env files that are not hidden
location ~* \.env {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block Cisco VPN probes
location ~* ^/\+CSCO(E|L)\+/ {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block JAR files
location ~* \.jar$ {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}

# Block complex query strings often used by bots/scrapers
# Matches query strings containing semicolons which are rare in normal usage
set $block_spam 0;
if ($query_string ~* ".*;.*") {
    set $block_spam 1;
}
if ($block_spam) {
    rewrite ^ /@blocked_spam last;
}

# Internal location to handle blocked spam query strings with custom logging
location = /@blocked_spam {
    access_log /var/log/nginx/security_violations.log main_ext;
    return 403;
}
