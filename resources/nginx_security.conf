# Log security violations to a separate file so they can be reviewed.
# The 'notice' level is used because 'deny' rules are logged at this level.
error_log /var/log/nginx/security_violations.log notice;

# Block probes for common vulnerabilities.
# Since this server hosts Django applications, any requests for PHP files
# are illegitimate and likely part of a vulnerability scan.

# Block requests for PHP files
location ~ \.php$ {
    deny all;
}

# Block requests for common WordPress paths
location ~* /(wp-admin|wp-login|wp-includes|xmlrpc\.php) {
    deny all;
}

# Block requests for other common scan targets and sensitive files
location ~* /(credentials|geoserver) {
    deny all;
}

# Block access to hidden files and directories (e.g., .git, .env)
location ~ /\. {
    deny all;
}

# Block requests for various .env files that are not hidden
location ~* \.env {
    deny all;
}
