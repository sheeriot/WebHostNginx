services:
  nginx:
    environment:
      CERTBOT_DOMAINS: "${CERTBOT_FQDN:-.}"
      CERTBOT_EMAIL: "${CERTBOT_EMAIL:-.}"
      NGINX_FQDN: "${NGINX_FQDN:-.}"
    build: .
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - informs_informs_staticfiles:/var/www/informs/static
    # networks:
    #   - webhost

  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./data/certbot/conf:/etc/letsencrypt
  #     - ./data/certbot/www:/var/www/certbot

volumes:
  informs_informs_staticfiles:
    external: true

networks:
  default: 
    name: webhost
    external: true
