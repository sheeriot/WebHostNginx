services:
  nginx:
    build: .
    restart: unless-stopped
    env_file: .env.vars
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./data/nginx/logs:/var/log/nginx
      - type: bind
        source: /var/www/sites
        target: /var/www/sites
        read_only: true
      # Informs static files (collected by Django collectstatic)
      - informs_staticfiles:/var/www/informs/static:ro
    networks:
      - webhost
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  # External volume from informs project
  informs_staticfiles:
    external: true
    name: informs_informs_staticfiles

networks:
  webhost:
    external: true
